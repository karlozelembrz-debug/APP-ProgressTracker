name: Build
on: {workflow_dispatch: {}, push: {tags: ['v*']}}
permissions: {contents: write}
jobs:
  build:
    strategy: {matrix: {os: [windows-latest, macos-latest, ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with: {name: "app-${{ matrix.os }}", path: "dist/*.*"}
      - name: Objavi na Releases (samo za oznake v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: {files: "dist/*.exe\ndist/*.dmg\ndist/*.AppImage"}
